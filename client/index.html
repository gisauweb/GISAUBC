<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GISAUBC</title>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<!-- Preconnect so the browser opens the socket early -->
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="preconnect" href="https://p.typekit.net" crossorigin />
		<!-- Load Proxima Nova asynchronously — does NOT block first paint -->
		<link
			rel="preload"
			href="https://use.typekit.net/mqr7lhi.css"
			as="style"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript><link rel="stylesheet" href="https://use.typekit.net/mqr7lhi.css" /></noscript>
		<link href="/src/index.css" rel="stylesheet" />
		<!-- SPA redirect decode for GitHub Pages — pairs with public/404.html -->
		<script>
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search
						.slice(1)
						.split('&')
						.map(function (s) { return s.replace(/~and~/g, '&'); })
						.join('?');
					window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
				}
			})(window.location);
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/index.jsx"></script>
	</body>
</html>
